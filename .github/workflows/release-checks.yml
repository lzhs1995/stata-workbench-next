name: Public Release Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14'
      - name: Install offline Python test dependencies
        run: python -m pip install anyio==4.15.1 idna==3.19 typing_extensions==4.16.0
      - name: Select the actual Python executable
        run: python -c "import os,sys; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('STATA_PATCH_TEST_PYTHON='+sys.executable+'\nPYTHON='+sys.executable+'\nSTATA_WORKBENCH_PYTHON='+sys.executable+'\n'); f.close()"
      - run: npm ci --ignore-scripts
      - run: npm audit
      - name: Shared logic and platform regressions (no licensed Stata)
        run: npm run check -- --keep-going
      - name: Python client and actual OS tests
        if: ${{ !cancelled() }}
        run: python -B -m unittest discover -s tools -p 'test_*.py'
      - run: python -B tools/verify_release.py
      - run: npm run package
      - run: python -B tools/verify_release.py --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}-${{ github.sha }}
          path: '*.vsix'
          retention-days: 7
