name: Reference Source Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build:reference
      - uses: actions/upload-artifact@v4
        with:
          name: reference-source-${{ matrix.os }}-${{ github.sha }}
          path: out/reference-source/BUILD-MANIFEST.json
          retention-days: 7
